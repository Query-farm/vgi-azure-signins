name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow release.yml / docker-publish.yml to run this exact suite as a gating
  # `uses:` job before they publish any binaries or images.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Include github.workflow so a direct CI run and the `uses:`-embedded CI job of
  # release.yml / docker-publish.yml land in DISTINCT groups (in a reusable workflow
  # github.workflow resolves to the CALLER), so the caller doesn't cancel in-flight CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner must speak the same VGI protocol as the community extension.
  HAYBARN_VERSION: "2.0.0rc11"

jobs:
  ci:
    uses: Query-farm/vgi-actions/.github/workflows/ts-ci.yml@main

  # SQL tests: test/sql/ through the published haybarn-unittest runner and the signed
  # community vgi extension, over every transport (ci/run-integration.sh, as in the
  # vgi-starter template). Credential-free: ATTACH, the advertised functions and tables,
  # and the catalog's executable bind-probe examples; live Azure scans need a secret.
  integration:
    name: SQL tests (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        env:
          WORKER: ${{ github.workspace }}/bin/vgi-azure-signins-worker
          HAYBARN_UNITTEST: ${{ github.workspace }}/.tools/bin/haybarn-unittest
          TRANSPORT: ${{ matrix.transport }}
        run: ci/run-integration.sh

  # Metadata-quality gate (vgi-lint): scores the worker's catalog/schema/function/view
  # docs, tags, categories, per-arg docs, and examples, and fails on any finding at info
  # or above. execute:false keeps it deterministic — the signin_logs / audit_logs table
  # functions are credential-gated (each requires an app-only `azure_graph` secret and a
  # live Microsoft Graph call to /auditLogs/* to return rows), so the VGI9xx live-scan
  # rules (VGI911 scan-responds) can't run without tenant credentials; the browsable
  # `audit_feeds` view and the LIMIT-0 executable examples cover the static surface. No
  # version pin: @v2 resolves the latest published vgi-lint-check 2.x, which runs on
  # haybarn 2.0 and attaches vgi.v3 workers (@v1 is haybarn 1.5 / vgi.v2 only).
  lint:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "bun run ${{ github.workspace }}/src/worker.ts"
          fail-on: info
          execute: "false"
